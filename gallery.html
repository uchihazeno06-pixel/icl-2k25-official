<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Gallery - Inspira College Set 2K25</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f9ff;
            color: #333;
            text-align: center;
            overflow-x: hidden;
        }
        header {
            background: #002147;
            color: white;
            padding: 25px 15px;
            font-size: 24px;
            font-weight: bold;
        }
        nav {
            background: white;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        nav a {
            color: #002147;
            text-decoration: none;
            font-weight: bold;
            margin: 0 12px;
            font-size: 15px;
        }
        nav a:hover { color: #4b7bec; }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }
        h2 { color: #002147; margin-bottom: 20px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .gallery img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            animation: popIn 0.5s ease-out forwards;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .gallery img:hover {
            transform: scale(1.08) rotate(1.5deg);
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
            z-index: 2;
            position: relative;
        }
        @keyframes popIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* floating sparkles background */
        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 18px;
            opacity: 0.5;
            animation: floatUp linear infinite;
            z-index: 0;
        }
        @keyframes floatUp {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 30, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        .lightbox.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
            animation: zoomIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            user-select: none;
        }
        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .lightbox .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            font-weight: bold;
            line-height: 1;
            transition: transform 0.2s;
        }
        .lightbox .close:hover { transform: scale(1.2) rotate(90deg); }
        .lightbox .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            padding: 20px;
            transition: transform 0.2s, color 0.2s;
            font-weight: bold;
        }
        .lightbox .arrow:hover { color: #4b7bec; transform: translateY(-50%) scale(1.2); }
        .lightbox .arrow.left  { left: 10px; }
        .lightbox .arrow.right { right: 10px; }
        .lightbox .counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 15px;
            background: rgba(255,255,255,0.12);
            padding: 6px 16px;
            border-radius: 20px;
        }
        footer {
            background: #002147;
            color: white;
            padding: 15px;
            font-size: 14px;
            margin-top: 40px;
            position: relative;
            z-index: 2;
        }
    </style>
</head>

        // Build gallery + track valid ones
        const gallery = document.getElementById("gallery");
        const validPhotos = [];

        photos.forEach((src, i) => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Set 2K25 Memory";
            img.loading = "lazy";
            img.style.animationDelay = (i * 0.04) + "s";
            img.onerror = () => img.remove();
            img.onload = () => validPhotos.push(src);
            img.addEventListener("click", () => openLightbox(src));
            gallery.appendChild(img);
        });

        // Sparkles
        const sparkleChars = ["✨", "💙", "⭐", "🎓", "💫"];
        for (let i = 0; i < 18; i++) {
            const s = document.createElement("div");
            s.className = "sparkle";
            s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
            s.style.left = Math.random() * 100 + "vw";
            s.style.animationDuration = (10 + Math.random() * 15) + "s";
            s.style.animationDelay = (Math.random() * 10) + "s";
            s.style.fontSize = (12 + Math.random() * 14) + "px";
            document.body.appendChild(s);
        }

        // Lightbox logic
        const lightbox   = document.getElementById("lightbox");
        const lightboxImg= document.getElementById("lightboxImg");
        const counter    = document.getElementById("counter");
        let currentIndex = 0;

        function openLightbox(src) {
            currentIndex = validPhotos.indexOf(src);
            if (currentIndex === -1) currentIndex = 0;
            showPhoto();
            lightbox.classList.add("active");
        }

        function showPhoto() {
            lightboxImg.src = validPhotos[currentIndex];
            counter.textContent = (currentIndex + 1) + " / " + validPhotos.length;
            // re-trigger zoom animation
            lightboxImg.style.animation = "none";
            void lightboxImg.offsetWidth;
            lightboxImg.style.animation = "zoomIn 0.35s cubic-bezier(0.22, 1, 0.36, 1)";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
        }

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % validPhotos.length;
            showPhoto();
        }

        function prevPhoto() {
            currentIndex = (currentIndex - 1 + validPhotos.length) % validPhotos.length;
            showPhoto();
        }

        document.getElementById("closeBtn").addEventListener("click", closeLightbox);
        document.getElementById("nextBtn").addEventListener("click", nextPhoto);
        document.getElementById("prevBtn").addEventListener("click", prevPhoto);
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("active")) return;
            if (e.key === "ArrowRight") nextPhoto();
            if (e.key === "ArrowLeft")  prevPhoto();
            if (e.key === "Escape")     closeLightbox();
        });
