<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Class - Inspira College Set 2K25</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f9ff;
            color: #333;
            text-align: center;
        }
        header {
            background: #002147;
            color: white;
            padding: 25px 15px;
            font-size: 24px;
            font-weight: bold;
        }
        nav {
            background: white;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        nav a {
            color: #002147;
            text-decoration: none;
            font-weight: bold;
            margin: 0 12px;
            font-size: 15px;
        }
        nav a:hover { color: #4b7bec; }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 { color: #002147; margin-bottom: 20px; }
        .names {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }
        .name {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            font-weight: bold;
            color: #002147;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
        }
        .name:hover {
            transform: translateY(-4px);
            background: #dde9ff;
        }
        footer {
            background: #002147;
            color: white;
            padding: 15px;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
